approval_policy = "never"
project_doc_max_bytes = 0
web_search = "disabled"

[shell_environment_policy]
inherit = "none"

[features]
shell_tool = false
unified_exec = false
shell_snapshot = false
view_image = false
apps = false
plugins = false
collab = false
multi_agent = false
js_repl = false
code_mode = false
hooks = false
codex_hooks = false
memory_tool = false
memories = false
search_tool = false
