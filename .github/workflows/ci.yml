name: RightyO CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rightyo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: rightyo/repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Record tested revisions
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python -c 'import os; print("PR head:", os.environ["PR_HEAD"] or "not applicable"); print("PR base:", os.environ["PR_BASE"] or "not applicable")'
          git rev-parse HEAD
      - name: Install pinned development tools
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-ci.txt
          python scripts/install_actionlint.py --dest /tmp/rightyo-tools/actionlint
      - name: Local verification parity
        run: python scripts/verify.py --actionlint /tmp/rightyo-tools/actionlint

  traceability:
    name: rightyo/traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out base policy only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Validate PR linkage with base policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            if [ -f scripts/check_pr.py ]; then
              python3 scripts/check_pr.py --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY"
            else
              # Bootstrap main has no parser yet. Read only event data; no PR checkout.
              python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          body = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())["pull_request"].get("body") or ""
          body = re.sub(r"<!--.*?-->|(?ms:^(`{3,}|~{3,}).*?^\1[^\n]*$)", "", body, flags=re.S)
          if not re.search(r"(?im)^\s*(?:refs?|fix(?:es)?|close[sd]?|resolve[sd]?)\s+#[1-9]\d*\b", body):
              raise SystemExit("Bootstrap PR requires an explicit issue link, e.g. Refs #15")
          print("Bootstrap issue-link syntax passed; independent review remains required")
          PY
            fi
          else
            echo "PR metadata check not applicable to a main push"
          fi

  aggregate:
    name: rightyo/ci
    if: ${{ always() }}
    needs: [repository, traceability]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require explicit success from all child jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {"repository", "traceability"}
          if set(results) != expected or any(job["result"] != "success" for job in results.values()):
              raise SystemExit("Required child job missing, failed, cancelled or skipped")
          print("All required checks explicitly succeeded")
          PY
