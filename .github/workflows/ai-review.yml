name: Subscription Codex review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ['RightyO CI', 'Native review activity relay']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number to recheck; this does not request or run a model'
        required: true
        type: string
      expected_head:
        description: 'Full current PR head SHA'
        required: true
        type: string
      expected_base:
        description: 'Full current PR base SHA'
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    name: Resolve trusted PR metadata
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.route.outputs.pr_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resolve authoritative callback PR association
        id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/subscription_review.py resolve

  record:
    name: Persist review request before publisher serialization
    needs: resolve
    if: ${{ needs.resolve.outputs.pr_number != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Persist authorized review request as denial-only metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: python3 scripts/subscription_review.py record

  gate:
    name: Validate completed subscription review
    needs: [resolve, record]
    if: ${{ needs.resolve.outputs.pr_number != '' }}
    concurrency:
      group: rightyo-subscription-${{ needs.resolve.outputs.pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify native Codex completion on the current head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: python3 scripts/subscription_review.py
