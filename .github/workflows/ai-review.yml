name: Subscription Codex review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ['RightyO CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number to recheck; this does not request or run a model'
        required: true
        type: string
      expected_head:
        description: 'Full current PR head SHA'
        required: true
        type: string
      expected_base:
        description: 'Full current PR base SHA'
        required: true
        type: string

permissions: {}

# Serialize publishers; an older event always refetches the current PR revision.
concurrency:
  group: rightyo-subscription-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validate completed subscription review
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify native Codex completion on the current head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/subscription_review.py
